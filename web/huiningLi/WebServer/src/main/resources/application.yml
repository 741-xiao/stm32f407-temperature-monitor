server:
  port: ${HTTP_PORT:8080}

spring:
  thymeleaf:
    prefix: classpath:/templates/
    cache: true
  datasource:
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:YOUR_DB_PASSWORD}
    url: ${DB_URL:jdbc:mysql://localhost:3306/mytest?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8

sensor:
  tcp-port: ${TCP_PORT:5107}
  developer-name: 肖肃
  student-id: "202440700102"

mybatis:
  typeAliasesPackage: com.hunau.domain
  mapperLocations: classpath:mybatis/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true
